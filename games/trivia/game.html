<title>Victoria’s Big Brain Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&family=Oswald:wght@400;500;600&family=Lilita+One&display=swap">
<style>
/* Layout: one buzzing game-show table — scoreboard strip on top, 5×5 board of "cards" below, questions open as a full-screen overlay for the projector. Single dark theme by design (a bright quiz-show night). */
:root{
  color-scheme: dark;
  --night:#0b1a22;
  --dusk:#12262f;
  --cell:#18323d;
  --cell-hi:#21424f;
  --line:#2c5363;
  --bone:#f2f7f8;
  --ash:#a6c0c8;
  --candle:#ffd23f;
  --ember:#fff0a8;
  --good:#5fe08a;
  --bad:#ff6b6b;
  --witch:#b48cff;
  --f-display:"Lilita One","Arial Rounded MT Bold","Helvetica",sans-serif;
  --f-text:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Oswald","Arial Narrow","Helvetica Neue",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--night);
  background-image:
    radial-gradient(ellipse 60% 45% at 88% -8%, color-mix(in srgb,var(--candle) 14%,transparent), transparent 70%),
    radial-gradient(ellipse 70% 50% at 0% 110%, color-mix(in srgb,var(--witch) 10%,transparent), transparent 70%);
  background-attachment:fixed;
  color:var(--bone);
  font-family:var(--f-ui);
  font-size:16px;
  line-height:1.45;
}
#app{
  max-width:1400px;margin:0 auto;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.btn{
  border:1px solid var(--line);background:var(--dusk);
  padding:.55em 1em;border-radius:999px;font-weight:700;letter-spacing:.02em;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--cell-hi);border-color:var(--ash)}
.btn.primary{background:var(--candle);color:var(--night);border-color:var(--candle)}
.btn.primary:hover{background:var(--ember);border-color:var(--ember)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--bad);color:var(--bad)}
/* Bug button: small and quiet in the bottom-left corner of every screen */
.bug-btn{position:fixed;left:10px;bottom:10px;z-index:80;display:inline-flex;align-items:center;gap:.3em;
  font:700 .72rem/1 var(--f-ui);letter-spacing:.04em;color:var(--ash);background:color-mix(in srgb,var(--night) 80%,transparent);
  border:1px solid var(--line);border-radius:999px;padding:.4em .75em .4em .55em;opacity:.55;cursor:pointer;transition:opacity .15s,color .15s}
.bug-btn:hover,.bug-btn:focus-visible{opacity:1;color:var(--bone)}
.bug-btn svg{width:14px;height:14px}
@media print{.bug-btn{display:none}}
.btn.small{padding:.35em .8em;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--ash)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- Setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start;padding-top:24px}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(3.4rem,9vw,7.5rem);line-height:.9;margin:.1em 0 .15em;color:var(--ember);text-shadow:0 0 30px color-mix(in srgb,var(--candle) 45%,transparent);text-wrap:balance}
.lede{font-family:var(--f-text);font-size:1.2rem;max-width:34em;color:var(--bone)}
.byline{display:block;font-family:var(--f-text);font-style:italic;font-weight:500;font-size:.3em;line-height:1.1;color:var(--candle);letter-spacing:.01em;text-shadow:none;margin-bottom:.2em}
.panel{background:color-mix(in srgb,var(--dusk) 85%,transparent);border:1px solid var(--line);border-radius:14px;padding:22px}
.teams-form{display:grid;gap:12px;margin-top:14px}
.count-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.count-row .btn[aria-pressed="true"]{background:var(--candle);color:var(--night);border-color:var(--candle)}
.field{display:grid;gap:4px}
.field label{font-size:.85rem;color:var(--ash);font-weight:700}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--night);color:var(--bone);border:1px solid var(--line);border-radius:8px;
  padding:.6em .7em;font:inherit;
}
textarea{resize:vertical;min-height:3.2em;font-family:var(--f-text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.rules{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.rules b{display:block;color:var(--ember)}
.rules p{margin:.15em 0 0;color:var(--bone);font-size:.98rem}
.glyph{width:34px;height:34px;flex:none}

/* ---------- Board ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.round-name{font-family:var(--f-display);font-size:clamp(2rem,4vw,3rem);line-height:1;color:var(--ember);margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.team{
  background:var(--dusk);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;min-width:0;
}
.team.turn{border-color:var(--candle);box-shadow:0 0 0 1px var(--candle),0 0 24px color-mix(in srgb,var(--candle) 25%,transparent)}
.team .tname{font-weight:800;overflow-wrap:anywhere}
.team .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--candle);font-weight:800}
.team .score{font-family:var(--f-num);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.team .score.neg{color:var(--bad)}
.team .adj{display:flex;gap:6px}
.team .adj button{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ash);font-weight:800;line-height:1}
.team .adj button:hover{color:var(--bone);border-color:var(--ash)}
.board-wrap{overflow-x:auto;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-width:640px}
.cat{
  display:flex;align-items:center;justify-content:center;text-align:center;min-height:78px;padding:10px;
  font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(.82rem,1.25vw,1.05rem);
  color:var(--bone);border-bottom:2px solid var(--candle);text-wrap:balance;
}
.cell{
  aspect-ratio:16/10;max-width:100%;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(180deg,var(--cell-hi),var(--cell));
  font-family:var(--f-num);font-weight:600;font-size:clamp(1.6rem,3.6vw,3rem);color:var(--candle);
  font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .2s,color .2s;
}
.cell:hover:not(.used){color:var(--ember);transform:translateY(-2px);box-shadow:0 8px 28px color-mix(in srgb,var(--candle) 28%,transparent)}
.cell.used{background:transparent;border-style:dashed;color:transparent;cursor:default}
.board-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;color:var(--ash);font-size:.92rem}
/* The board screen is exactly one screen tall: header, scores and footer take what they need, the grid shares the rest */
.board-screen{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);height:calc(100vh - 60px);height:calc(100dvh - 60px);min-height:480px}
.board-screen > .topbar,.board-screen > .scores,.board-screen > .board-foot{margin:0}
.board-screen .round-name{font-size:clamp(1.6rem,min(4vw,5.5vh),3rem)}
.board-screen .team{padding:clamp(6px,1vh,10px) 12px}
.board-screen .team .score{font-size:clamp(1.4rem,4vh,2.1rem)}
.board-screen .board-wrap{flex:1 1 auto;min-height:0;overflow:auto;padding-bottom:0}
.board-screen .board{height:100%;min-height:300px;grid-template-rows:auto repeat(5,minmax(0,1fr));gap:clamp(6px,1.2vh,10px)}
.board-screen .cat{min-height:0;padding:clamp(4px,.8vh,10px) 8px;font-size:clamp(.72rem,min(1.25vw,2.1vh),1.05rem)}
.board-screen .cell{aspect-ratio:auto;min-height:0;font-size:clamp(1.3rem,min(3.6vw,6vh),3rem)}

/* ---------- Overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;overflow-y:auto;
  background:color-mix(in srgb,var(--night) 94%,transparent);backdrop-filter:blur(6px);
  padding-top:calc(24px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.qcard{max-width:1040px;margin:0 auto;display:grid;gap:22px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .val{font-family:var(--f-num);font-size:2rem;color:var(--candle)}
.qtext{font-family:var(--f-text);font-size:clamp(1.5rem,3.6vw,2.8rem);line-height:1.22;margin:0;text-wrap:balance}
.special{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--dusk)}
.special.blackcat{border-color:var(--candle)}
.special.witch{border-color:var(--witch)}
.special h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1}
.special.blackcat h3{color:var(--candle)}
.special.witch h3{color:var(--witch)}
.special p{margin:.3em 0 0}
.special .glyph{width:64px;height:64px}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick .btn{font-size:1.05rem}
.timer{display:flex;align-items:center;gap:14px}
.timer svg{width:74px;height:74px;transform:rotate(-90deg)}
.timer .t{font-family:var(--f-num);font-size:2rem;min-width:2.2ch;font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--bad)}
.answer{border-left:4px solid var(--candle);padding:6px 0 6px 18px}
.answer .a{font-family:var(--f-text);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.6rem);color:var(--ember);line-height:1.2}
.answer .note{margin-top:10px;color:var(--bone);font-family:var(--f-text);font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.35;max-width:46em;opacity:.9}
.judge{display:grid;gap:8px}
.jrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:var(--r);background:var(--dusk);border:1px solid var(--line)}
.jrow .jn{font-weight:800;flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.jrow .jn small{display:block;font-weight:700;color:var(--candle);text-transform:uppercase;letter-spacing:.1em;font-size:.7rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.4em .9em;font-weight:700;font-size:.95rem}
.seg button[aria-pressed="true"].ok{background:var(--good);border-color:var(--good);color:var(--night)}
.seg button[aria-pressed="true"].half{background:var(--ember);border-color:var(--ember);color:var(--night)}
.seg button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:var(--night)}
.wager{width:7.5em}
.hint{color:var(--ash);font-size:.92rem;margin:0}
.kbd{font-family:var(--f-num);border:1px solid var(--line);border-radius:4px;padding:0 .35em;font-size:.85em}

/* ---------- Final & podium ---------- */
.stage{max-width:1040px;margin:0 auto;display:grid;gap:22px;padding-top:10px}
.big-cat{font-family:var(--f-display);font-size:clamp(2.8rem,8vw,6rem);line-height:.95;color:var(--ember);margin:0;text-wrap:balance}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin-top:20px}
.step{display:grid;gap:8px;text-align:center}
.step .who{font-weight:800;font-size:1.15rem;overflow-wrap:anywhere}
.step .pts{font-family:var(--f-num);font-size:1.6rem;color:var(--candle)}
.block{border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;
  font-family:var(--f-display);font-size:3rem;color:var(--night);transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.p1 .block{height:220px;background:var(--ember);animation-delay:.5s}
.p2 .block{height:160px;background:var(--ash);animation-delay:.25s}
.p3 .block{height:115px;background:var(--candle);animation-delay:0s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rest{display:grid;gap:6px;margin-top:8px}
.rest div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:8px;background:var(--dusk)}

/* ---------- Editor ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .btn[aria-selected="true"]{background:var(--candle);color:var(--night);border-color:var(--candle)}
.ecat{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;background:var(--dusk)}
.eq{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;padding-top:12px;border-top:1px solid var(--line)}
.eq .v{font-family:var(--f-num);font-size:1.3rem;color:var(--candle);padding-top:.3em}
.eq .fields{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.eq .fields .wide{grid-column:1 / -1}

/* ---------- Rules slides ---------- */
.deck{min-height:calc(100dvh - 60px);display:grid;grid-template-rows:1fr auto;gap:24px}
.slide{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,80px);align-items:center;animation:slidein .45s ease both}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide-art{display:flex;justify-content:center;align-items:center;min-width:0}
.slide-text{min-width:0}
.slide-title{font-family:var(--f-display);font-weight:400;font-size:clamp(3rem,7vw,6.5rem);line-height:.95;color:var(--ember);margin:.12em 0 .35em;text-wrap:balance}
.slide-list{list-style:none;margin:0;padding:0;display:grid;gap:.7em;font-family:var(--f-text);font-size:clamp(1.3rem,2.5vw,2.1rem);line-height:1.3;max-width:24em}
.slide-list li{padding-left:1.1em;position:relative}
.slide-list li::before{content:"";position:absolute;left:0;top:.5em;width:.42em;height:.42em;border-radius:50%;background:var(--candle)}
.slide-big{font-family:var(--f-text);font-size:clamp(1.6rem,3.4vw,2.8rem);line-height:1.25;margin:0}
.slide-big b{color:var(--ember)}
.glyph.hero{width:clamp(150px,24vw,320px);height:auto}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{padding:.35em .9em;border:1px solid var(--candle);border-radius:999px;font-weight:800;font-size:clamp(1rem,1.8vw,1.4rem)}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:min(560px,100%)}
.mini .h{font-size:clamp(.55rem,.95vw,.78rem);font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:4px 2px;border-bottom:2px solid var(--candle);display:flex;align-items:flex-end;justify-content:center;min-height:3.4em;text-wrap:balance}
.mini .v{aspect-ratio:16/10;border-radius:6px;background:linear-gradient(180deg,var(--cell-hi),var(--cell));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);color:var(--candle);font-size:clamp(.85rem,1.8vw,1.5rem)}
.mini .v.pick{box-shadow:0 0 0 2px var(--ember),0 0 26px color-mix(in srgb,var(--candle) 50%,transparent);color:var(--ember)}
.half-art{width:clamp(160px,22vw,280px);aspect-ratio:1;max-width:100%;border-radius:50%;border:4px dashed var(--candle);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:clamp(4.5rem,11vw,8.5rem);color:var(--ember)}
.ladder{display:grid;gap:8px;width:min(260px,100%)}
.ladder div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px;border-radius:8px;background:var(--dusk);border:1px solid var(--line);font-family:var(--f-num);font-size:clamp(1.2rem,2.4vw,2rem);color:var(--candle)}
.ladder s{color:var(--ash);font-size:.7em}
.deck-bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ash);background:transparent;padding:0}
.dot.on{background:var(--candle);border-color:var(--candle)}

/* ---------- Deal with the Witch: two wands, two reels ---------- */
.reels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.reel{border:1px solid var(--witch);border-radius:16px;padding:20px 16px;display:grid;gap:14px;justify-items:center;text-align:center;min-width:0;
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--witch) 16%,transparent),transparent 70%),var(--dusk)}
.reel-label{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--witch)}
.reel-face{font-family:var(--f-display);font-size:clamp(3rem,8vw,6rem);line-height:1.05;color:var(--ash);min-height:1.15em;display:flex;align-items:center;justify-content:center;max-width:100%;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.reel-face.teamname{font-size:clamp(2rem,5vw,3.8rem)}
.witch-reveal{display:grid;gap:22px}
.witch-reveal .howto li,.witch-reveal .reel,.witch-reveal .witch-quote{animation:rise-in .5s ease both}
.witch-reveal .howto li:nth-child(2){animation-delay:.12s}
.witch-reveal .howto li:nth-child(3){animation-delay:.24s}
.witch-reveal .reel{animation-delay:.36s}
.witch-reveal .reel + .reel{animation-delay:.48s}
.reel.spinning .reel-face{color:var(--witch);filter:blur(.5px)}
.reel.done{box-shadow:0 0 0 2px var(--witch),0 0 46px color-mix(in srgb,var(--witch) 45%,transparent)}
.reel.done .reel-face{color:var(--ember);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.55);opacity:.3}100%{transform:scale(1);opacity:1}}
.wand-btn svg{transition:transform .2s}
.wand-btn.waving svg{animation:wave .7s ease}
@keyframes wave{0%{transform:rotate(0)}25%{transform:rotate(-35deg)}55%{transform:rotate(20deg)}100%{transform:rotate(0)}}
/* Black cat: after the narrator asks, the other teams appear big and centered */
.cat-pick{display:grid;justify-items:center;gap:clamp(16px,3vh,28px);text-align:center;padding-top:clamp(8px,2vh,24px)}
.cat-ask{font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;color:var(--candle);margin:0;animation:rise-in .5s ease both}
.cat-teams{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,2vw,24px)}
.cat-team{font-family:var(--f-display);font-size:clamp(2rem,5vw,3.8rem);line-height:1.1;padding:.25em .9em;border-radius:20px;border:2px solid var(--candle);background:var(--dusk);color:var(--bone);
  animation:rise-in .5s ease both;transition:transform .15s,background .15s,color .15s}
.cat-team:hover,.cat-team:focus-visible{background:var(--candle);color:var(--night);transform:translateY(-3px) scale(1.03)}
@keyframes rise-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.witch-quote{font-family:var(--f-text);font-style:italic;font-size:clamp(1.2rem,2.4vw,1.7rem);margin:.3em 0 0;color:var(--bone)}
/* Step-by-step rules on the surprise screens; the current step lights up */
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none;counter-reset:step}
.howto li{counter-increment:step;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--dusk);
  font-family:var(--f-text);font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.35;opacity:.5;transition:opacity .3s,border-color .3s,box-shadow .3s}
.howto li::before{content:counter(step);font-family:var(--f-num);font-size:1.5em;line-height:1;color:var(--candle)}
.howto li.done{opacity:.8}
.howto li.now{opacity:1;border-color:var(--candle);box-shadow:0 0 0 1px var(--candle),0 0 24px color-mix(in srgb,var(--candle) 22%,transparent)}
.howto li b{color:var(--ember)}
.howto.witch li::before{color:var(--witch)}
.howto.witch li.now{border-color:var(--witch);box-shadow:0 0 0 1px var(--witch),0 0 24px color-mix(in srgb,var(--witch) 25%,transparent)}

/* ---------- Voice ---------- */
.vgrid{display:grid;gap:18px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:700;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--candle);margin-top:2px;flex:none}
.check small{display:block;font-weight:400;color:var(--ash);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--candle)}
.rangehead{display:flex;justify-content:space-between;align-items:baseline}
.rangehead span{color:var(--candle)}
.btn svg{vertical-align:-3px}

@media (max-width:820px){
  .howto{grid-template-columns:minmax(0,1fr)}
  .reels{grid-template-columns:minmax(0,1fr)}
  .slide{grid-template-columns:minmax(0,1fr);gap:20px}

/* ---------- Sparks: two slow layers of yellow and violet specks drifting up behind the game ---------- */
body::before,body::after{content:"";position:fixed;inset:-20vh 0 0;pointer-events:none;z-index:0;
  background-image:radial-gradient(2px 2px at 20px 30px,rgba(255,210,63,.5),transparent 60%),radial-gradient(1.5px 1.5px at 120px 80px,rgba(180,140,255,.45),transparent 60%),
  radial-gradient(2.5px 2.5px at 200px 160px,rgba(255,240,168,.35),transparent 60%),radial-gradient(1.5px 1.5px at 60px 210px,rgba(180,140,255,.4),transparent 60%),
  radial-gradient(2px 2px at 260px 250px,rgba(255,210,63,.3),transparent 60%);
  background-size:300px 300px;animation:snow 46s linear infinite;opacity:.45}
body::after{background-size:420px 420px;animation-duration:60s;opacity:.35;filter:blur(.6px)}
@keyframes snow{from{transform:translateY(20vh)}to{transform:translateY(0)}}
#app{position:relative;z-index:1}
.title,.round-name,.slide-title,.big-cat,.cat-ask,.cat-team,.reel-face,.special h3{letter-spacing:.01em}

/* ===================== Storage ===================== */
const KEY_S = "bb-state-v1", KEY_Q = "bb-questions-v1";
const clone = o => JSON.parse(JSON.stringify(o));
function load(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function drop(k){ try { localStorage.removeItem(k); } catch(e){} }

const TEAM_NAMES = ["Team Brainiacs","Team Know-It-Alls","Team Smarty Pants","Team Quizzards"];
function freshState(n, names){
  n = n || 3;
  return {
    screen: "setup", teamCount: n,
    teams: (names || TEAM_NAMES).slice(0,4).map((name,i)=>({ name: name || TEAM_NAMES[i], score: 0 })),
    round: 0, used: {}, turn: 0, q: null, final: null, sound: true, editor: null, specials: null
  };
}

/* Surprises are dealt to random cells at the start of every game, so nobody can learn where they are.
   Each round gets 2 × "cat" and 1 × "witch", never on the two cheapest rows and never two of the same kind
   in one category. A question the host pinned in the editor (q.special) always keeps its surprise. */
const SURPRISES = { cat: 2, witch: 1 };
function dealSpecials(){
  const out = {};
  Q.rounds.forEach((r, ri) => {
    const free = [], need = Object.assign({}, SURPRISES), taken = { cat: new Set(), witch: new Set() };
    r.categories.forEach((cat, ci) => cat.qs.forEach((q, i) => {
      if (q.special && need[q.special] !== undefined){ out[ri + "-" + ci + "-" + i] = q.special; need[q.special] = Math.max(0, need[q.special] - 1); taken[q.special].add(ci); }
      else if (i >= 2) free.push([ci, i]);
    }));
    for (let k = free.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [free[k], free[j]] = [free[j], free[k]]; }
    ["witch", "cat"].forEach(kind => {
      for (const [ci, i] of free){
        if (need[kind] <= 0) break;
        const key = ri + "-" + ci + "-" + i;
        if (out[key] || taken[kind].has(ci)) continue;
        out[key] = kind; taken[kind].add(ci); need[kind]--;
      }
    });
  });
  return out;
}
function specialAt(c, i){ if (!S.specials) S.specials = dealSpecials(); return S.specials[S.round + "-" + c + "-" + i] || null; }

let Q = load(KEY_Q) || clone(DEFAULT_Q);
if (!Q.tiebreak) Q.tiebreak = clone(DEFAULT_Q.tiebreak);
/* Carry corrected default questions into a copy saved in this browser, without touching the host's own edits */
let S = load(KEY_S) || freshState(3);
let hist = [];
let armed = null;            // two-click confirmations
let timer = { id: null, left: 0, total: 0, running: false };

function persist(){ const s = clone(S); s.editor = null; s.voicePanel = null; s.voiceExport = null; save(KEY_S, s); }
function persistQ(){ save(KEY_Q, Q); }

/* ===================== Voice (browser speech) ===================== */
const KEY_V = "bb-voice-v1";
const V = Object.assign({ on: true, answers: true, waitTimer: true, slides: true, engine: "pack", name: "", rate: 0.9, pitch: 0.8 }, load(KEY_V) || {});
function persistV(){ save(KEY_V, V); }
const TTS = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) ? window.speechSynthesis : null;
let voices = [], speakSeq = 0, fallbackT = null;
function voiceScore(v){
  return (/natural|neural|online/i.test(v.name) ? 4 : 0) + (/en-CA/i.test(v.lang) ? 2 : 0) + (/en-US/i.test(v.lang) ? 1 : 0) + (/google/i.test(v.name) ? 1 : 0);
}
function loadVoices(){
  if (!TTS) return;
  try { voices = TTS.getVoices().filter(v => /^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)); } catch(e){ voices = []; }
}
function pickVoice(){
  if (!voices.length) loadVoices();
  return voices.find(v => v.name === V.name) || voices[0] || null;
}
if (TTS){
  loadVoices();
  try { TTS.addEventListener("voiceschanged", () => { loadVoices(); if (S.voicePanel) render(); }); } catch(e){}
}
function stopSpeech(){ speakSeq++; clearTimeout(fallbackT); if (curAudio){ try { curAudio.pause(); } catch(e){} curAudio = null; } try { if (TTS) TTS.cancel(); } catch(e){} }
function say(text, onDone, opts){
  opts = opts || {};
  stopSpeech();
  const done = typeof onDone === "function" ? onDone : null;
  const file = packFile(String(text || "").trim());
  if ((!TTS && !file) || (!V.on && !opts.force) || !text){ if (done) done(); return; }
  const my = speakSeq;
  let finished = false;
  const finish = () => { if (finished || my !== speakSeq) return; finished = true; clearTimeout(fallbackT); if (done) done(); };
  const words = String(text).split(/\s+/).length;
  const browser = () => {
    if (my !== speakSeq) return;
    if (!TTS){ finish(); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-CA";
      u.rate = V.rate; u.pitch = V.pitch;
      u.onend = finish; u.onerror = finish;
      TTS.speak(u);
      fallbackT = setTimeout(finish, 5000 + words * 450 / V.rate);   // safety net if the browser never reports the end
    } catch(e){ finish(); }
  };
  setTimeout(() => {
    if (my !== speakSeq) return;
    if (!file){ browser(); return; }
    try {
      const a = new Audio(PACK.base + file); curAudio = a;
      a.onended = finish;
      a.onerror = () => { if (curAudio === a) curAudio = null; browser(); };
      const p = a.play(); if (p && p.catch) p.catch(() => { if (curAudio === a) curAudio = null; browser(); });
      fallbackT = setTimeout(finish, 20000 + words * 700);
    } catch(e){ browser(); }
  }, opts.delay || 60);
}

const answerLine = x => "The answer is: " + x.a + (x.note ? ". " + x.note : "");
/* What the narrator actually receives: the same words plus Eleven v4 audio tags for mood */
function ttsText(t){
  const fixed = {
    [LINES.test]: "[cheerfully] Welcome to Victoria's Big Brain Battle. Pick a question... and use your head!",
    [LINES.welcome]: "[excited] Welcome to Victoria's Big Brain Battle! Tonight, our teams put their brains to the test... for glory, and for prizes. Here is how it works.",
    [LINES.ready]: "[cheerfully] Ready? The first team, pick a question. Good luck... and may the biggest brains win! [laughs]",
    [LINES.rules]: "[cheerfully] Rules of the game. Pick a question from the board. [mischievously] Watch out for the wild card... and for the mystery box. [cheerfully] Play two rounds... and the All In finale.",
    [LINES.cat]: "[gasps] A wild card! [mischievously] The team that drew it... must give this question to another team.",
    [LINES.catWho]: "[mischievously] So... who gets the wild card?",
    [LINES.witchTitle]: "[whispers] The mystery... [excited] box!",
    [LINES.witch]: "[excited] Let's open the mystery box! [laughs] The first ticket picks the price. The second ticket picks the team that must answer. Answer right... and win it. Answer wrong... [whispers] and lose it.",
    [LINES.tie]: "[gasps] It's a tie! Time for a tiebreaker."
  };
  if (fixed[t]) return fixed[t];

/* Places: equal scores share a place unless a tiebreaker ordered them (S.tbOrder, closest first). */
function standings(){
  const T = teams().map((t,i)=>({ ...t, i }));
  const tb = S.tbOrder || [];
  const pos = t => { const k = tb.indexOf(t.i); return k < 0 ? Infinity : k; };
  const better = (a,b) => a.score > b.score || (a.score === b.score && pos(a) < pos(b));
  T.forEach(t => { t.rank = 1 + T.filter(o => better(o, t)).length; });
  return T.sort((a,b) => a.rank - b.rank || a.i - b.i);
}
function tiedForPrizes(){
  const st = standings();
  return st.filter(t => t.rank === 1 && st.some(o => o.i !== t.i && o.rank === t.rank));   // only one team wins, so only a tie for first matters
}
function announceWinners(){
  const st = standings(), w = st.filter(t => t.rank === 1);
  if (w.length === 1) say(winnerLine(w[0].name), null, { delay: 1500 });
  else say(LINES.tie, null, { delay: 1500 });
}
const tbQ = () => Q.tiebreak || DEFAULT_Q.tiebreak;

function viewPodium(){
  const st = standings();
  const top = st.filter(t => t.rank <= 3), rest = st.filter(t => t.rank > 3);
  const winners = st.filter(t => t.rank === 1);
  const tied = tiedForPrizes();
  const headline = winners.length === 1 ? esc(winners[0].name) + " win the Big Brain Battle"
    : winners.length === st.length ? "It's a tie!"
    : winners.map(w => esc(w.name)).join(" and ") + " tie for first";
  const order = ({1:[0], 2:[1,0], 3:[1,0,2], 4:[2,0,1,3]})[top.length] || top.map((_,k)=>k);
  const slot = t => `<div class="step p${Math.min(t.rank,3)}"><div class="who">${esc(t.name)}</div><div class="pts">${fmt(t.score)}</div><div class="block">${t.rank}</div></div>`;
  return `<div class="stage">
    <div class="eyebrow">Victoria’s Big Brain Battle · final standings</div>
    <h1 class="big-cat">${headline}</h1>
    ${tied.length ? `<div class="special blackcat">${CAT_SVG}<div><h3>Tie!</h3>
      <p>${tied.map(t => esc(t.name)).join(", ")} have the same score. Play a tiebreaker to decide the winner: the closest number wins.</p></div></div>
      <div class="actions" style="margin-top:0"><button class="btn primary" data-act="tbstart">Play the tiebreaker</button></div>` : ""}
    <div class="podium" style="grid-template-columns:repeat(${order.length},minmax(0,1fr))">${order.map(k => slot(top[k])).join("")}</div>
    ${(S.tbOrder || []).length ? `<p class="hint">Equal scores were split by the tiebreaker.</p>` : ""}
    ${rest.length ? `<div class="rest">${rest.map(t=>`<div><span>${t.rank}. ${esc(t.name)}</span><span class="num">${fmt(t.score)}</span></div>`).join("")}</div>` : ""}
    <div class="actions">
      <button class="btn" data-act="toboard">Back to the board</button>
      <button class="btn ghost ${armed==="new"?"warn":""}" data-act="new">${armed==="new" ? "Click again to end this game" : "New game"}</button>

}

        ${Q.rounds.map((r,i)=>`<button class="btn small" role="tab" data-act="etab" data-t="${i}" aria-selected="${tab===i}">${esc(r.name)}</button>`).join("")}
        <button class="btn small" role="tab" data-act="etab" data-t="final" aria-selected="${tab==="final"}">All In</button>
      </div>
      ${body}
      <div class="actions"><button class="btn primary" data-act="edone">Done</button>
        <button class="btn ghost ${armed==="reset"?"warn":""}" data-act="ereset">${armed==="reset"?"Click again to restore the original questions":"Restore original questions"}</button></div>
    </div></div>`;
}

function viewVoice(){
  let body;
  if (!TTS){
    body = `<p class="lede">This browser can't read text aloud. Open the game in Microsoft Edge or Google Chrome.</p>`;
  } else {
    const cur = pickVoice();
    body = `<div class="panel vgrid">
      <label class="check" for="v-on"><input type="checkbox" id="v-on" data-v="on" ${V.on?"checked":""}><span>Read questions aloud<small>Each question is read when it opens. Surprises, the final category and the winners are announced too.</small></span></label>
      <label class="check" for="v-ans"><input type="checkbox" id="v-ans" data-v="answers" ${V.answers?"checked":""}><span>Read answers aloud<small>The answer is read when you press Show answer.</small></span></label>
      <label class="check" for="v-wait"><input type="checkbox" id="v-wait" data-v="waitTimer" ${V.waitTimer?"checked":""}><span>Start the timer after the question is read<small>Teams get the full 30 seconds once they have heard the question.</small></span></label>
      <div class="field"><label for="v-name">Voice</label><select id="v-name" data-v="name">
        ${voices.length ? voices.map(v=>`<option value="${esc(v.name)}" ${cur && cur.name===v.name ? "selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("") : `<option value="">Default voice</option>`}
      </select></div>
      <div class="field"><div class="rangehead"><label for="v-rate">Speed</label><span class="num" id="o-rate">${V.rate}</span></div>
        <input type="range" id="v-rate" data-v="rate" min="0.6" max="1.4" step="0.05" value="${V.rate}"></div>
      <div class="field"><div class="rangehead"><label for="v-pitch">Pitch</label><span class="num" id="o-pitch">${V.pitch}</span></div>
        <input type="range" id="v-pitch" data-v="pitch" min="0.3" max="1.6" step="0.05" value="${V.pitch}"></div>
      <div class="actions" style="margin-top:0">
        <button class="btn primary" data-act="vtest">${SPEAK_SVG} Test the voice</button>
        <button class="btn" data-act="vpreset" data-p="spooky">Quiz host voice</button>
        <button class="btn ghost" data-act="vpreset" data-p="normal">Normal voice</button>
      </div>
    </div>
    <p class="hint">Voices come from this computer's browser. Voices marked "Natural" or "Online" sound the most human, and Microsoft Edge on Windows has the best set. When you share your screen in Teams, turn on "Include computer sound" so the colleague on video hears the voice too.</p>`;
  }
  const lines = voiceLines(), ready = PACK ? lines.filter(l => PACK.lines[l.text]).length : 0;
  const narrator = `<div class="panel vgrid" style="margin-bottom:16px">
      <div class="field"><span class="eyebrow">Narrator</span>
        <div class="pick">
          <button class="btn small ${V.engine !== "browser" ? "primary" : ""}" data-act="vengine" data-e="pack" aria-pressed="${V.engine !== "browser"}">Game narrator</button>
          <button class="btn small ${V.engine === "browser" ? "primary" : ""}" data-act="vengine" data-e="browser" aria-pressed="${V.engine === "browser"}">Browser voice</button>
        </div></div>
      <p class="hint" style="margin:0">${PACK
        ? `Narrator: ${esc(NARRATOR)}. ${ready === lines.length ? `All ${lines.length} lines are recorded.` : `${ready} of ${lines.length} lines are recorded. The rest use the browser voice.`}`
        : "No narrator audio has been added yet, so the browser voice is used."}</p>
    </div>`;
  body = narrator + body;
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Voice settings">
    <div class="qcard" style="max-width:760px">
      <div class="qhead"><h2 class="round-name">Voice</h2><button class="btn primary" data-act="vdone">Done</button></div>
      ${body}
    </div></div>`;
}

/* ===================== Timer ===================== */
function startTimer(sec){ stopTimer(); timer.total = sec; timer.left = sec; timer.running = true; timer.id = setInterval(tickTimer, 1000); if (finalAsking()) Music.start(); }
function stopTimer(){ if (timer.id) clearInterval(timer.id); timer.id = null; timer.running = false; timer.waiting = false; Music.stop(); }
function readThenTime(text, sec, delay){
  if (TTS && V.on && V.waitTimer){
    stopTimer(); timer.total = sec; timer.left = sec; timer.waiting = true; paintTimer();
    say(text, () => { if (timer.waiting){ startTimer(sec); paintTimer(); } }, { delay });
  } else {
    startTimer(sec); paintTimer(); say(text, null, { delay });
  }
}
function answerSpeech(){ return answerLine({ a: currentText("a"), note: currentText("n") }); }
function currentText(which){
  if (S.q){ const it = R().categories[S.q.c].qs[S.q.i]; return which === "a" ? it.a : which === "n" ? (it.note || "") : it.q; }
  if (S.screen === "final" && S.final) return which === "a" ? Q.final.a : which === "n" ? (Q.final.note || "") : Q.final.q;
  if (S.screen === "tiebreak" && S.tb) return which === "a" ? tbQ().a : which === "n" ? (tbQ().note || "") : tbQ().q;
  return "";
}
function tickTimer(){
  timer.left = Math.max(0, timer.left - 1);
  if (timer.left > 0 && timer.left <= 5) SFX.tick();
  if (timer.left === 0){ stopTimer(); SFX.end(); }
  paintTimer();
}
function paintTimer(){
  const t = document.getElementById("tleft"), ring = document.getElementById("ring"), box = document.getElementById("timer");
  if (!t || !ring) return;
  t.textContent = timer.left;
  ring.setAttribute("stroke-dashoffset", String(213.6 * (1 - (timer.total ? timer.left / timer.total : 0))));
  box.classList.toggle("low", timer.left <= 5);
  const pb = box.querySelector('[data-act="tpause"]'); if (pb) pb.textContent = timer.waiting ? "Start now" : timer.running ? "Pause" : (timer.left===0 ? "Time's up" : "Resume");
}

/* ===================== Actions ===================== */
function nextTurn(){ S.turn = (S.turn + 1) % S.teamCount; }

const actions = {
  count(el){ S.teamCount = +el.dataset.n; persist(); render(); },
  start(){
    const names = teams().map(t=>t.name);
    const allNames = S.teams.map(t=>t.name);
    const n = S.teamCount;
    S = freshState(n, allNames); S.teams.forEach((t,i)=>{ if(names[i]) t.name = names[i]; });
    S.specials = dealSpecials();   // a new random layout of surprises for every game
    S.screen = "rules"; S.deck = "intro"; S.slide = 0; S.rulesReturn = false; hist = []; armed = null; persist(); render(); audio(); readSlide();
  },
  resume(){ S.screen = S.final ? (S.final.stage==="done" ? "podium" : "final") : "board"; persist(); render(); audio(); },
  edit(){ S.editor = { tab: S.screen==="board" ? S.round : 0 }; armed = null; render(); },
  etab(el){ const t = el.dataset.t; S.editor.tab = t === "final" ? "final" : +t; render(); },
  edone(){ S.editor = null; armed = null; persistQ(); render(); },
  ereset(){ if (armed !== "reset"){ armed = "reset"; render(); return; } Q = clone(DEFAULT_Q); persistQ(); armed = null; render(); },
  sound(){ S.sound = !S.sound; persist(); render(); if (S.sound) SFX.reveal(); },
  undo(){ undo(); },
  adj(el){ pushHist(); const t = S.teams[+el.dataset.i]; t.score += +el.dataset.d; persist(); render(); },
  turn(){ nextTurn(); persist(); render(); },
  new(){
    if (armed !== "new"){ armed = "new"; render(); return; }
    armed = null; stopTimer(); stopSpeech(); const names = S.teams.map(t=>t.name), n = S.teamCount;
    S = freshState(n, names); hist = []; persist(); render();
  },
  next(){
    if (S.final && S.final.stage === "done"){ armed = null; S.screen = "podium"; persist(); render(); return; }
    if (remaining() > 0 && armed !== "next"){ armed = "next"; render(); return; }
    armed = null;
    /* Before Round Two and before the final, show that round's rules slide first */
    S.screen = "rules"; S.slide = 0; S.rulesReturn = false;
    S.deck = S.round < Q.rounds.length - 1 ? "round2" : "midnight";
    persist(); render(); if (S.deck === "midnight") SFX.witch(); else SFX.open(); readSlide();
  },
  open(el){
    armed = null;
    const c = +el.dataset.c, i = +el.dataset.i, item = R().categories[c].qs[i], sp = specialAt(c, i);
    S.q = { c, i, value: R().values[i], special: sp, picker: S.turn, team: sp ? null : S.turn, bid: null, w: { price: null, team: null }, judged: {}, stage: sp ? "intro" : "ask" };
    persist(); render();
    if (sp === "cat"){
      SFX.cat();
      const cq = S.q;
      const reveal = () => { if (S.q === cq && cq.stage === "intro" && !cq.catAsk){ cq.catAsk = true; persist(); render(); return true; } return false; };
      say(LINES.cat, () => { if (reveal()) say(LINES.catWho, null, { delay: 150 }); }, { delay: 700 });
      setTimeout(reveal, 9000);   // never leave the host without the team buttons
    }
    else if (sp === "witch"){
      SFX.witch();
      const wq = S.q;
      const reveal = () => { if (S.q === wq && wq.stage === "intro" && !wq.witchAsk){ wq.witchAsk = true; persist(); render(); return true; } return false; };
      say(LINES.witchTitle, () => { if (reveal()) say(LINES.witch, null, { delay: 250 }); }, { delay: 700 });
      setTimeout(reveal, 8000);   // never leave the host without the wands
    }
    else { SFX.open(); readThenTime(item.q, 30, 700); }
  },
  cancel(){ witchSpin = 0; stopTimer(); stopSpeech(); S.q = null; persist(); render(); },
  wand1(el){
    const q = S.q; if (!q || q.special !== "witch" || witchSpin) return;
    q.w = q.w || { price: null, team: null }; if (q.w.price != null) return;
    const vals = R().values, idx = rnd(vals.length);
    stopSpeech(); waveWand(el); SFX.wand(); el.disabled = true;
    document.querySelectorAll('[data-act="wand2"]').forEach(b => b.disabled = true);
    spinReel("reel-price", vals.map(fmt), idx, () => {
      q.w.price = vals[idx]; q.bid = vals[idx]; persist(); render(); SFX.magic();
      say(priceLine(vals[idx]), null, { delay: 300 });
    });
  },
  wand2(el){
    const q = S.q; if (!q || q.special !== "witch" || witchSpin || !q.w || q.w.price == null || q.w.team != null) return;
    const T = teams(), idx = rnd(T.length);
    stopSpeech(); waveWand(el); SFX.wand(); el.disabled = true;
    spinReel("reel-team", T.map(t => t.name), idx, () => {
      q.w.team = idx; q.team = idx; persist(); render(); SFX.magic();
      say(dealLine(T[idx].name), null, { delay: 300 });
    });
  },
  witchgo(){ const q = S.q; if (!q || !q.w || q.w.team == null) return; q.stage = "ask"; persist(); render(); readThenTime(currentText("q"), 30, 200); },
  catto(el){ S.q.team = +el.dataset.i; S.q.stage = "ask"; persist(); render(); readThenTime(currentText("q"), 30, 200); },
  witchto(el){
    const b = parseInt(document.getElementById("bid").value, 10);
    S.q.bid = Math.max(S.q.value, isNaN(b) ? S.q.value : b);
    S.q.team = +el.dataset.i; S.q.stage = "ask"; persist(); render(); readThenTime(currentText("q"), 30, 200);
  },
  tpause(){ if (timer.running){ stopTimer(); } else if (timer.left > 0){ timer.waiting = false; timer.running = true; timer.id = setInterval(tickTimer,1000); if (finalAsking()) Music.start(); } paintTimer(); },
  trestart(){ startTimer(timer.total || 30); paintTimer(); },
  reveal(){ stopTimer(); stopSpeech(); S.q.stage = "answer"; persist(); render(); SFX.reveal(); if (V.answers) say(answerSpeech(), null, { delay: 500 }); },
  judge(el){
    const i = +el.dataset.i, v = el.dataset.v;
    S.q.judged[i] = S.q.judged[i] === v ? undefined : v;
    if (S.q.judged[i] === "ok" || S.q.judged[i] === "half") SFX.good(); else if (S.q.judged[i] === "no") SFX.bad();
    persist(); render();
  },
  done(){
    stopSpeech();
    const q = S.q; pushHist();
    const stakes = q.special === "witch" && q.bid ? q.bid : q.value;
    Object.entries(q.judged).forEach(([i,v])=>{
      if (!v) return; const t = S.teams[+i];
      if (v === "ok") t.score += stakes; else if (v === "half") t.score += Math.round(stakes/2); else if (v === "no") t.score -= stakes;
    });
    S.used[key(S.round,q.c,q.i)] = true; S.q = null; nextTurn(); persist(); render();
  },
  fask(){ S.final.stage = "ask"; persist(); render(); SFX.open(); readThenTime(Q.final.q, 60, 700); },
  freveal(){ stopTimer(); stopSpeech(); S.final.stage = "answer"; persist(); render(); SFX.reveal(); if (V.answers) say(answerSpeech(), null, { delay: 500 }); },
  fjudge(el){ const i = +el.dataset.i, v = el.dataset.v; readWagers(); S.final.judged[i] = S.final.judged[i] === v ? null : v; persist(); render(); if (v==="ok") SFX.good(); else SFX.bad(); },
  fdone(){
    readWagers(); pushHist();
    teams().forEach((t,i)=>{
      const w = Math.min(Math.max(0, S.final.wagers[i] || 0), maxWager(t));
      if (S.final.judged[i] === "ok") t.score += w; else if (S.final.judged[i] === "no") t.score -= w;
    });
    S.final.stage = "done"; S.tbOrder = []; S.screen = "podium"; persist(); render(); SFX.good();
    announceWinners();
  },
  tbstart(){
    S.tb = { stage: "ask", teams: tiedForPrizes().map(t => t.i) }; S.tbOrder = [];
    S.screen = "tiebreak"; persist(); render(); SFX.witch(); readThenTime(tbQ().q, 30, 700);
  },
  tbreveal(){ stopTimer(); stopSpeech(); S.tb.stage = "answer"; persist(); render(); SFX.reveal(); if (V.answers) say(answerSpeech(), null, { delay: 500 }); },
  tbpick(el){ const i = +el.dataset.i, o = S.tbOrder, k = o.indexOf(i); if (k >= 0) o.splice(k, 1); else o.push(i); persist(); render(); },
  tbdone(){ stopSpeech(); S.screen = "podium"; S.tb = null; persist(); render(); SFX.good(); announceWinners(); },
  toboard(){ stopSpeech(); S.screen = "board"; persist(); render(); },
  voice(){ S.voicePanel = true; armed = null; render(); },
  vdone(){ S.voicePanel = null; S.voiceExport = null; persistV(); render(); },
  vengine(el){ V.engine = el.dataset.e; persistV(); render(); actions.vtest(); },
  vcopy(el){
    const lines = voiceLines(), json = JSON.stringify(lines, null, 2);
    const fallback = () => { S.voiceExport = json; render(); };
    try { navigator.clipboard.writeText(json).then(() => { el.textContent = "Copied " + lines.length + " lines"; }, fallback); } catch(e){ fallback(); }
  },
  vtest(){ say(LINES.test, null, { force: true }); },
  vpreset(el){
    if (el.dataset.p === "spooky"){ V.rate = 0.85; V.pitch = 0.55; } else { V.rate = 1; V.pitch = 1; }
    persistV(); render(); actions.vtest();
  },
  speakq(){
    const t = currentText("q"); if (!t) return;
    if (timer.waiting) readThenTime(t, timer.total || 30, 0); else say(t, null, { force: true });
  },
  speaka(){ if (currentText("a")) say(answerSpeech(), null, { force: true }); },
  rules(){ stopSpeech(); S.screen = "rules"; S.deck = "intro"; S.slide = 0; S.rulesReturn = true; armed = null; persist(); render(); readSlide(); },
  snext(){
    const n = slides().length;
    if ((S.slide || 0) >= n - 1){
      stopSpeech();
      if (S.deck === "round2"){ S.deck = "intro"; S.round++; S.turn = 0; S.screen = "board"; persist(); render(); SFX.open(); say(roundLine(R()), null, { delay: 800 }); return; }
      if (S.deck === "midnight"){ S.deck = "intro"; S.screen = "final"; S.final = { stage: "category", wagers: [], judged: [] }; persist(); render(); SFX.witch(); say(midnightLine(), null, { delay: 800 }); return; }
      S.screen = "board"; persist(); render(); SFX.open(); return;
    }
    S.slide = (S.slide || 0) + 1; persist(); render(); readSlide();
  },
  sprev(){ if ((S.slide || 0) > 0){ S.slide--; persist(); render(); readSlide(); } },
  sgo(el){ S.slide = +el.dataset.k; persist(); render(); readSlide(); },
  sskip(){ stopSpeech(); S.screen = "board"; persist(); render(); SFX.open(); },
  sread(){ readSlide(true); },
  sauto(){ V.slides = !V.slides; persistV(); render(); if (V.slides) readSlide(true); else stopSpeech(); }
};
function readWagers(){ document.querySelectorAll("[data-wager]").forEach(inp=>{ const v = parseInt(inp.value,10); S.final.wagers[+inp.dataset.wager] = isNaN(v) ? 0 : v; }); }

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (armed && !["new","next","ereset"].includes(a)) armed = null;
  const fn = actions[a]; if (fn) fn(el);
});
app.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.v){
    const k = el.dataset.v;
    if (el.type === "checkbox") V[k] = el.checked;
    else if (el.type === "range"){ V[k] = parseFloat(el.value); const o = document.getElementById("o-" + k); if (o) o.textContent = String(V[k]); }
    else V[k] = el.value;
    if (k === "on" && !V.on) stopSpeech();
    persistV(); return;
  }
  if (el.dataset.team != null){ S.teams[+el.dataset.team].name = el.value; persist(); return; }
  if (el.dataset.path){ setPath(el.dataset.path, el.value); persistQ(); }
});
app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.path && el.tagName === "SELECT"){ setPath(el.dataset.path, el.value || undefined); persistQ(); }
});
function setPath(path, val){
  const parts = path.split("."); let o = Q;
  for (let k=0;k<parts.length-1;k++){ const p = parts[k]; o = o[/^\d+$/.test(p) ? +p : p]; }
  const last = parts[parts.length-1];
  if (val === undefined || val === "") { if (last === "special" || last === "note") delete o[last]; else o[last] = ""; }
  else o[last] = val;
}
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName||"").toLowerCase();
  if (["input","textarea","select"].includes(tag)) return;
  if (S.screen === "rules" && !S.editor && !S.voicePanel){
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || ((k === " " || k === "Enter") && tag !== "button")){ e.preventDefault(); actions.snext(); return; }
    if (k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); actions.sprev(); return; }
  }
  if (e.code === "Space"){
    if (S.q && S.q.stage === "ask"){ e.preventDefault(); actions.reveal(); }
    else if (S.screen === "final" && S.final && S.final.stage === "ask"){ e.preventDefault(); actions.freveal(); }
    else if (S.screen === "tiebreak" && S.tb && S.tb.stage === "ask"){ e.preventDefault(); actions.tbreveal(); }
  }
  if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey){
    if ((S.q && S.q.stage !== "intro") || (S.screen === "final" && S.final && S.final.stage === "ask") || (S.screen === "tiebreak" && S.tb && S.tb.stage === "ask")) actions.speakq();
  }
  if (e.key === "Escape"){
    if (S.voicePanel){ actions.vdone(); }
    else if (S.editor){ actions.edone(); }
    else if (S.q && S.q.stage !== "answer"){ actions.cancel(); }
  }
});

/* ===================== Bug report =====================
   A small "Bug" button on every screen opens an e-mail to Victoria with the game, the screen and the browser filled in. */
const BUG_TO = ["hello", "gamenights.quest"].join("@");   // Namecheap forwards it to her Gmail
function bugReport(){
  const q = S.q, rnd = Q.rounds[S.round] || {}, cat = q && rnd.categories ? rnd.categories[q.c] : null;
  const info = [
    "Game: " + document.title,
    "Screen: " + S.screen + ", round " + (S.round + 1) + ", " + S.teamCount + " teams",
    q ? "Question: " + (cat ? cat.name : "?") + " for " + q.value + (q.special ? " (surprise " + q.special + ")" : "") + ", step " + q.stage : "",
    S.screen === "final" && S.final ? "Final: step " + S.final.stage : "",
    "Browser: " + navigator.userAgent,
    "Window: " + innerWidth + " x " + innerHeight,
    "Page: " + (location.protocol === "file:" ? "file on this computer" : location.origin + location.pathname)
  ].filter(Boolean).join("\n");
  const body = "What happened?\n\n\nWhat did you expect to happen?\n\n\n" +
    "----- Please keep the lines below. They help find the bug. -----\n" + info;
  location.href = "mailto:" + BUG_TO + "?subject=" + encodeURIComponent("Bug report: " + document.title) + "&body=" + encodeURIComponent(body);
}
(function(){
  const b = document.createElement("button");
  b.type = "button"; b.className = "bug-btn"; b.title = "Found a bug? Write to Victoria"; b.setAttribute("aria-label", "Report a bug");
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="14" rx="5" ry="6.5"/><path d="M12 7.5V20.5M9 5.5l1.5 2M15 5.5l-1.5 2M7 11H3.5M7 15.5H3.5M17 11h3.5M17 15.5h3.5M7.5 19l-2.5 2M16.5 19l2.5 2"/></svg>Bug';
  b.addEventListener("click", bugReport);
  document.body.appendChild(b);
})();

/* ===================== Boot ===================== */
function start(data){
  if (data && data.S) S = data.S;
  if (data && data.Q) Q = data.Q;
  if (S.q && S.q.stage === "intro"){ S.q.catAsk = true; S.q.witchAsk = true; }   // after a reload, show the cat/witch controls right away
  if (S.q && S.q.stage === "ask"){ timer.left = 30; timer.total = 30; }
  if (S.screen === "final" && S.final && S.final.stage === "ask"){ timer.left = 60; timer.total = 60; }
  render();
}
loadPack();
try { window.claude?.hot?.snapshot?.(() => ({ S, Q })); } catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
